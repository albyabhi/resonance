<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/src/assets/Rlogo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Phase 3 – Static meta tags ──────────────────────────── -->
    <!-- Tell browsers this page supports both light and dark schemes -->
    <meta name="color-scheme" content="light dark" />

    <!-- Media-aware theme-color: first matching tag wins.
         Chrome & Safari read the media attribute and pick the right one
         based on the OS preference. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F6F2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0B0C0C" />

    <!-- Fallback theme-color (no media) – used by crawlers and browsers
         that don't support the media attribute. Phase 4's sync hook
         updates this tag dynamically when the user toggles. -->
    <meta name="theme-color" content="#F7F6F2" />

    <!-- ── Phase 6 – PWA manifest link ─────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <title>Resonance 2026</title>

    <!-- ── Phase 5 – SSR-correctness (SPA equivalent) ──────────── -->
    <!-- Apply the persisted theme BEFORE React hydrates so the user
         never sees a flash of the wrong colour.  This inline script
         runs synchronously and is tiny (~200 bytes).

         ⚠ SYNC: implements the SAME decision table as
         src/lib/theme/themeCore.js (resolveThemePreference).
         If you change the rules there, change them here too. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch (e) { /* storage blocked — fall through to system */ }
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = stored === 'dark' || (stored !== 'light' && prefersDark);

        // Apply dark class immediately
        if (dark) document.documentElement.classList.add('dark');

        // Update the fallback <meta name="theme-color"> tag to match
        var fallback = document.querySelector('meta[name="theme-color"]:not([media])');
        if (fallback) fallback.setAttribute('content', dark ? '#0B0C0C' : '#F7F6F2');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
